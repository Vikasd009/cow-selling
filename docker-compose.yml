services:

  mysql:
    image: mysql:8.4
    container_name: cow-selling-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cow_selling_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - cow-network


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cow-selling-backend

    restart: unless-stopped

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:mysql://mysql:3306/cow_selling_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword

      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

    networks:
      - cow-network


volumes:
  mysql_data:


networks:
  cow-network:
    driver: bridge