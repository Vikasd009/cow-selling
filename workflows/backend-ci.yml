name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Make Maven Wrapper executable
        run: chmod +x mvnw


      - name: Build and test
        run: ./mvnw clean verify